<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="plateFill" cx="46%" cy="40%" r="68%">
      <stop offset="0" stop-color="#2c1a10"/>
      <stop offset="0.48" stop-color="#17100b"/>
      <stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c5a34"/>
      <stop offset="0.35" stop-color="#4f2b1c"/>
      <stop offset="0.7" stop-color="#b66a3c"/>
      <stop offset="1" stop-color="#2a1710"/>
    </linearGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.58" numOctaves="4" seed="12" result="n"/>
      <feColorMatrix in="n" type="matrix" values="
        0 0 0 0 0.50
        0 0 0 0 0.25
        0 0 0 0 0.13
        0 0 0 0.22 0" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="screen"/>
    </filter>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feOffset dx="-2" dy="-2" result="hi"/>
      <feOffset in="blur" dx="3" dy="3" result="lo"/>
      <feFlood flood-color="#a7613c" flood-opacity="0.34" result="hc"/>
      <feFlood flood-color="#000000" flood-opacity="0.78" result="lc"/>
      <feComposite in="hc" in2="hi" operator="in" result="h"/>
      <feComposite in="lc" in2="lo" operator="in" result="l"/>
      <feMerge><feMergeNode in="l"/><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.96" filter="url(#rough)">
    <circle cx="300" cy="700" r="430" fill="url(#plateFill)" stroke="url(#edge)" stroke-width="11"/>
    <circle cx="300" cy="700" r="372" fill="none" stroke="#713d28" stroke-width="4" opacity="0.72"/>
    <circle cx="300" cy="700" r="310" fill="none" stroke="#321c14" stroke-width="18" opacity="0.92"/>
    <circle cx="300" cy="700" r="222" fill="#0c0907" stroke="#6a3c28" stroke-width="8" opacity="0.98"/>
    <circle cx="300" cy="700" r="98" fill="#070605" stroke="#4a281c" stroke-width="6"/>
  </g>

  <g filter="url(#emboss)" font-family="Arial Black, Arial, sans-serif" font-weight="900" letter-spacing="10">
    <text x="104" y="450" transform="rotate(-70 104 450)" font-size="122" fill="#1a100b" stroke="#75442d" stroke-width="2.4">20 KG</text>
    <text x="670" y="770" transform="rotate(72 670 770)" font-size="48" fill="#160e0a" stroke="#633a27" stroke-width="1.4" letter-spacing="7">STANDARD</text>
  </g>

  <path d="M-20 970 C240 860 530 850 760 930" fill="none" stroke="#cf7540" stroke-width="3" opacity="0.18"/>
</svg>