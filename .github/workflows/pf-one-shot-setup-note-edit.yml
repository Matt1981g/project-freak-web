name: PF Setup Note Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pf-one-shot-setup-note-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply patch
        run: python scripts/patch_setup_note_editor.py

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutScreen.tsx src/features/workout/WorkoutScreen.module.css
          git diff --cached --quiet && exit 0
          git commit -m "Add quick setup note editor to workout logger"
          git push origin HEAD:main
