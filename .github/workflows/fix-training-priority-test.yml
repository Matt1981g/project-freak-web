name: Repair stale training priority test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-training-priority-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update stale priority-count assertion and remove repair workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/application/coach/trainingExport.test.ts')
          text = path.read_text()
          old = "expect(payload.coach_context.training_priorities.current).toHaveLength(12)"
          new = "expect(payload.coach_context.training_priorities.current).toHaveLength(13)"
          if old not in text:
              raise SystemExit('Expected stale assertion was not found.')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-training-priority-test.yml').unlink()
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/coach/trainingExport.test.ts .github/workflows/fix-training-priority-test.yml
          git commit -m "Fix Adductors training export test expectation"
          git push
