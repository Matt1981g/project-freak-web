name: PROJECT FREAK CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: Validate release verifier
        run: node --check scripts/verify-deployment.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install required browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Required Chromium and WebKit tests
        run: npx playwright test
