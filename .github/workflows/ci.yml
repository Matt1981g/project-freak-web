name: PROJECT FREAK CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: Repair advisory-affected dependencies within existing version ranges
        run: npm audit fix --audit-level=high
      - name: Capture reviewed lockfile change
        run: |
          echo PF_UPDATED_LOCK_BEGIN
          cat package-lock.json
          echo PF_UPDATED_LOCK_END
      - name: Audit dependencies (high severity)
        run: npm audit --audit-level=high

      - name: Validate release verifier
        run: node --check scripts/verify-deployment.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_PF_BUILD_SHA: ${{ github.sha }}
      - name: Install required browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Required Chromium and WebKit tests
        run: npx playwright test
