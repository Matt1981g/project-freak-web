name: PROJECT FREAK CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate release verifier
        run: node --check scripts/verify-deployment.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
