name: PF dependency refresh probe (temporary)

on:
  push:
    branches:
      - pf/workflow-release-controls-20261011

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve tested dependency lockfile
        run: |
          npm install --save-dev @playwright/test@1.62.1 vitest@4.1.11
          npm update brace-expansion source-map-js
          node -e "for (const n of ['package.json','package-lock.json']) { const b=Buffer.from(require('fs').readFileSync(n)).toString('base64'); const k=n==='package.json'?'PACKAGE':'LOCK'; for(let i=0;i<b.length;i+=6000) console.log('PF_DEP_'+k+'_'+(i/6000)+'='+b.slice(i,i+6000)); console.log('PF_DEP_'+k+'_END='+(Math.ceil(b.length/6000))); }"
      - run: npm audit --omit=dev --audit-level=high
